services:
  mysql:
    image: mysql:8.0.37-debian
    container_name: aixiaoshuo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-500231Wdl0614}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aixs}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_allowed_packet=256M
      - --default-authentication-plugin=mysql_native_password   # MySQL 8.0 支持
    volumes:
      - ./data/mysql:/var/lib/mysql   # ← 挂载到当前目录下的 data/mysql
    networks:
      - aixiaoshuo-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aixiaoshuo-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-500231Wdl0614}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aixs}
      UPLOAD_FOLDER: /app/uploads
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: 1
    volumes:
      - ./data/uploads:/app/uploads   # ← 上传文件挂载到当前目录下的 data/uploads
    networks:
      - aixiaoshuo-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aixiaoshuo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-9000}:80"
    networks:
      - aixiaoshuo-network
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# 注意：由于使用了 bind mount，不再需要顶层 volumes 定义

networks:
  aixiaoshuo-network:
    driver: bridge
